# Dockerfile recommendations disabled scenario
title: Dockerfile Recommendations Disabled
description: Verify recommendations are suppressed when recommend=false query parameter is set.
expect_success: true
env:
  TRUSTIFY_DA_RECOMMEND: "false"
  # Pin the platform so the CLI doesn't need docker/podman to detect it when
  # resolving the multi-arch :latest tag (skopeo handles the digest lookup).
  TRUSTIFY_DA_IMAGE_PLATFORM: "linux/amd64"
stack_analysis:
  providers:
    rhtpa: {}
  recommendations:
    expect_recommendations: false
component_analysis:
  providers:
    rhtpa: {}
  recommendations:
    expect_recommendations: false
